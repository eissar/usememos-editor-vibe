<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>text-edit</title>
    <style>
      :root {
        --bg: #16181d;
        --bg-alt: #1d2027;
        --fg: #d6dae3;
        --dim: #7b8494;
        --accent: #6ea8fe;
        --warn: #e5b567;
        --bad: #e06c75;
        --ok: #98c379;
        --border: #2a2e38;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column;
        font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg); color: var(--fg);
      }
      header {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 10px; border-bottom: 1px solid var(--border);
        background: var(--bg-alt); user-select: none;
      }
      #tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; }
      .tab {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 8px; border-radius: 5px; cursor: pointer;
        white-space: nowrap; color: var(--dim);
        border: 1px solid var(--border);
      }
      .tab:hover { background: #262a33; }
      .tab.active { background: var(--bg); color: var(--fg); border-color: var(--accent); }
      .tab .label.untitled { font-style: italic; }
      .tab .marks { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre; display: inline-flex; }
      .tab .marks > span { display: inline-block; width: 1ch; text-align: center; }
      .tab .sync { color: var(--dim); }
      .tab .sync.failed, .tab .unsaved.late { color: var(--bad); font-weight: 700; }
      .tab .close { opacity: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; width: 1ch; text-align: center; }
      .tab:hover .close { opacity: .6; }
      .tab .close:hover { opacity: 1; color: var(--bad); }
      .tab .close.blocked, .tab .close.blocked:hover { color: var(--dim); cursor: not-allowed; }
      #editor { flex: 1; min-height: 0; overflow: hidden; }
      .cm-editor { height: 100%; }
      .cm-scroller { font: 13px/1.55 ui-monospace, "SF Mono", Menlo, monospace; }
      footer {
        display: flex; gap: 14px; align-items: center;
        padding: 3px 10px; border-top: 1px solid var(--border);
        background: var(--bg-alt); color: var(--dim); font-size: 11px;
        user-select: none;
      }
      footer > * { flex: none; white-space: nowrap; }
      footer .spacer { flex: 1; }
      /* A long message is cut with an ellipsis (full text on hover) instead of
       * wrapping the footer and squeezing the buttons. */
      footer #status { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      footer .k { color: var(--fg); }
      footer button {
        font: inherit; color: var(--fg); background: #262a33;
        border: 1px solid var(--border); border-radius: 4px;
        padding: 1px 8px; cursor: pointer;
      }
      footer button:hover { background: #313641; }
      #empty button {
        font: inherit; color: var(--fg); background: #262a33;
        border: 1px solid var(--border); border-radius: 4px;
        padding: 3px 10px; cursor: pointer;
      }
      body { position: relative; }
      #browser {
        position: absolute; inset: 40px 40px 34px; z-index: 10;
        display: flex; flex-direction: column;
        background: var(--bg-alt); border: 1px solid var(--border); border-radius: 6px;
        box-shadow: 0 8px 30px #0008; outline: none;
      }
      #browser[hidden] { display: none; }
      #browser .bar {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 12px; border-bottom: 1px solid var(--border);
      }
      #browser .spacer { flex: 1; }
      #browser .info { color: var(--dim); }
      #browser button {
        background: #262a33; color: var(--fg); border: 1px solid var(--border);
        border-radius: 4px; padding: 2px 10px; font: inherit; cursor: pointer;
      }
      #browser button:disabled { opacity: .4; cursor: default; }
      #browser .rows { overflow-y: auto; flex: 1; }
      #browser .row {
        display: grid; grid-template-columns: 1fr auto auto; gap: 16px;
        padding: 5px 12px; border-bottom: 1px solid var(--border);
      }
      #browser .row:nth-child(even) { background: #1a1d23; }
      #browser .snippet { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #browser .time { color: var(--dim); }
      #browser button.memo-id {
        background: none; border: none; padding: 0; border-radius: 0;
        color: var(--accent); font-family: ui-monospace, Consolas, monospace;
        text-decoration: underline; cursor: pointer;
      }
      #browser button.memo-id:disabled { color: var(--dim); }
      #empty {
        display: grid; place-items: center; height: 100%; color: var(--dim);
      }
    </style>
  </head>
  <body>
    <header>
      <div id="tabs"></div>
    </header>
    <div id="editor"><div id="empty">Loading... If this message stays, the editor script failed to start.</div></div>
    <div id="browser" tabindex="-1" hidden>
      <div class="bar">
        <strong>Memos</strong>
        <span class="info"></span>
        <span class="spacer"></span>
        <button class="prev">Prev</button>
        <button class="next">Next</button>
        <button class="close-browser">Close</button>
      </div>
      <div class="rows"></div>
    </div>
    <footer>
      <span id="status">idle</span>
      <span class="spacer"></span>
      <span><span class="k">Ctrl+S</span> save + sync now</span>
      <span><span class="k">Ctrl+W</span> close (deletes; needs sync)</span>
      <span><span class="k">Ctrl+Tab</span> next tab</span>
      <button id="browse">Browse</button>
      <button id="reveal">Cache folder</button>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
